name: Build and unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Excel-boundary-windows-x64
          path: |
            build/release/ReadingSmooth.dll
            build/release/ReadingBoundary.xll
